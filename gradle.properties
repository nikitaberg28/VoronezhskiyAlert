# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# NOTE: Starting with Minecraft 26.1, the game is no longer obfuscated and
# Fabric no longer uses Yarn mappings - official Mojang mappings are used
# by default instead, so there is no "yarn_mappings" property anymore.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.16.2

# Mod Properties
mod_version=1.3.0
maven_group=nikitaberg.voronezhskiyalert
archives_base_name=VoronezhskiyAlert

# Dependencies
# Double check this against https://fabricmc.net/develop/ or modrinth.com/mod/fabric-api
# before building - Fabric API versions are tied tightly to each Minecraft drop.
# NOTE: an earlier value here (0.153.0+26.2) turned out not to be a real published
# version, which silently caused Gradle to resolve a mismatched/stale artifact set
# missing the newer HUD API (HudElementRegistry) - confirmed via web search that
# published 26.2 releases run from 0.145.6+26.2 up through 0.158.0+26.2 (as of the
# last check), so this picks the latest confirmed-real one instead of guessing.
fabric_api_version=0.158.0+26.2